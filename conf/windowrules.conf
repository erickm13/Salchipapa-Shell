# Reglas de ventana
# Sintaxis de Hyprland 0.56: "propiedad valor, match:campo patrón"
#   - La propiedad SIEMPRE lleva valor: 'float true' (no solo 'float').
#   - Los filtros van con 'match:' y un patrón regex: match:class ..., match:title ...
#   - Varios filtros encadenados con comas se combinan (AND).

# Flotar apps/diálogos comunes
windowrule = float true, match:class pavucontrol|org\.pulseaudio\.pavucontrol
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class nm-connection-editor
windowrule = float true, match:title (Open|Save) (File|Folder).*
windowrule = float true, match:title Save As

# Centrar las ventanas flotantes (no las xwayland, para no romper popups)
windowrule = center true, match:float true, match:xwayland false

# Sin sombra en ventanas a pantalla completa
windowrule = no_shadow true, match:fullscreen true

# Ejemplo (desactivado): opacidad para kitty
# windowrule = opacity 0.95 0.9, match:class kitty
