# Reglas de ventana (sintaxis windowrulev2 / windowrule moderna)

# Flotar diálogos comunes
windowrule = float, class:^(pavucontrol)$
windowrule = float, title:^(Open File)(.*)$
windowrule = float, title:^(Save File)(.*)$

# Sin sombra/round en ventanas a pantalla completa
windowrule = noshadow, fullscreen:1

# Evitar que apps en idle "maximicen" el consumo (ejemplo)
# windowrule = opacity 0.9 0.9, class:^(kitty)$
