# Decoración: redondeo, blur, sombra
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    # Sombra convertida en "glow" del color de acento en la ventana activa (como caelestia)
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(a6e3a155)          # verde (acento) translúcido = brillo
        color_inactive = rgba(0a0a0f99) # ventanas inactivas: sombra oscura normal
    }
}
