# Arranque automático
# Portales y agente de polkit (ajusta la ruta del agente a tu distro si hace falta)
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# Notificaciones: las gestiona la barra (Quickshell es el servidor de notificaciones).
# NO lanzar dunst: chocaría con el servidor de la isla (solo puede haber uno).
# exec-once = dunst

# Barra / shell (Quickshell). Es también el servidor de notificaciones.
exec-once = qs -p ~/proyects/Salchipapa-Shell/shell/shell.qml

# Fondo de pantalla: aún no hay herramienta instalada (hyprpaper/swww).
# Cuando instales una, descomenta:
# exec-once = hyprpaper
# exec-once = swww-daemon

# (la barra Quickshell ya está arriba; se recarga sola al editar shell/shell.qml)
