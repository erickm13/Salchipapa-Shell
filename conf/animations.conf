# Animaciones — curvas Material 3 (tomadas de caelestia, la "fluidez" que me gusta)
# Hyprland solo admite una curva bezier cúbica por línea (x1,y1,x2,y2).
# speed está en deciseconds (10 = 1s). Más bajo = más rápido.
animations {
    enabled = true

    # Curvas (Material 3). Las "expressive" con y>1 dan un leve overshoot/rebote.
    bezier = standard,        0.2,  0,    0,    1
    bezier = emphasizedAccel, 0.3,  0,    0.8,  0.15
    bezier = emphasizedDecel, 0.05, 0.7,  0.1,  1
    bezier = expressive,      0.38, 1.21, 0.22, 1
    bezier = expressiveFast,  0.42, 1.67, 0.21, 0.9
    bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1

    # Ventanas
    animation = windowsIn,   1, 5, emphasizedDecel, popin 80%
    animation = windowsOut,  1, 4, emphasizedAccel, popin 80%
    animation = windowsMove, 1, 5, standard

    # Capas (menús, launcher, notificaciones)
    animation = layersIn,  1, 5, emphasizedDecel, slide
    animation = layersOut, 1, 4, emphasizedAccel, slide
    animation = fadeLayers, 1, 5, standard

    # Workspaces y resto
    animation = workspaces, 1, 5, expressive, slide
    animation = specialWorkspace, 1, 4, specialWorkSwitch, slidevert
    animation = fade,   1, 5, standard
    animation = border, 1, 5, standard
}
