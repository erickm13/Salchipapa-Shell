# Layout, gaps y borde
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Colores del borde (gradiente). Luego los cambiaré por un esquema propio.
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
