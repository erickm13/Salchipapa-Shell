# Layout, gaps y borde
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Colores del borde (gradiente) — acento verde con brillo, a juego con la shell
    col.active_border = rgba(a6e3a1ee) rgba(94e2d5ee) 45deg
    col.inactive_border = rgba(45475aaa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    # 'pseudotile' ya no es opción en Hyprland 0.56: se usa el dispatcher 'pseudo' (Super+P)
    preserve_split = true
}

master {
    new_status = master
}
