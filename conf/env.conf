# Variables de entorno (Wayland)
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# Qt en Wayland (con fallback a xcb para apps X11)
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
# Platform theme: hace que Qt (incl. la shell Quickshell) use el tema de iconos
# de qtengine (Papirus-Dark). Sin esto, faltan iconos en el launcher.
env = QT_QPA_PLATFORMTHEME, qtengine

# Cursor
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
