# Entrada: teclado, ratón, touchpad
input {
    kb_layout = us
    # kb_options = compose:ralt   # tecla compose si la quieres

    follow_mouse = 1
    sensitivity = 0               # -1.0 a 1.0 (0 = sin aceleración)

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Gestos (sintaxis nueva de Hyprland 0.49+): deslizar 3 dedos = cambiar workspace
gesture = 3, horizontal, workspace
