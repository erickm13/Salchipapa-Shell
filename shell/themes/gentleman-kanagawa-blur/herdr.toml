# herdr con Gentleman Kanagawa Blur: su tema integrado kanagawa con los colores de blur encima
# (acento = el amarillo de blur, como CursorLineNr/Search; superficies = CursorLine/Visual).
[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
accent = "#e0c15a"
text = "#f3f6f9"
subtext0 = "#8394a3"
surface0 = "#191e28"
surface1 = "#232a36"
overlay0 = "#5c6170"
red = "#cb7c94"
green = "#b7cc85"
yellow = "#ffe066"
blue = "#7fb4ca"
