# Salchipapa-Shell — config de Hyprland propia
# Probar sin tocar caelestia:  Hyprland -c ~/proyects/Salchipapa-Shell/hyprland.conf
# (desde una TTY libre, p.ej. Ctrl+Alt+F3)

$mod = SUPER

# Programas por defecto (cambia aquí, no en cada bind)
$terminal = kitty
$menu = fuzzel
$browser = firefox
$fileManager = $terminal -e yazi

# Raíz de esta config (para los source de abajo)
$conf = ~/proyects/Salchipapa-Shell/conf
$scripts = ~/proyects/Salchipapa-Shell/scripts

source = $conf/monitors.conf
source = $conf/env.conf
source = $conf/general.conf
source = $conf/decoration.conf
source = $conf/animations.conf
source = $conf/input.conf
source = $conf/windowrules.conf
source = $conf/keybinds.conf
source = $conf/autostart.conf
